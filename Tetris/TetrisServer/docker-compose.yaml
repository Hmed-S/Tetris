name: TetrisServer
services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
    networks:
      - redis-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: TetrisServer
      RI_REDIS_USERNAME: ${REDIS_USERNAME}
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-insight-data:/data
    networks:
      - redis-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
    driver: local
  redis-insight-data:
    driver: local
networks:
  redis-network:
    driver: bridge