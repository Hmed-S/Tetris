name: Test and deploy TetrisServer

on:
  push:
    branches:
      - main
    paths:
      - 'Tetris/TetrisServer/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker is available
        run: docker info

      - name: Build unit tests
        run: dotnet build Tetris/Tests/Server/UnitTest
          
      - name: Run unit tests
        run: dotnet test Tetris/Tests/Server/UnitTest

      - name: Build integration tests
        run: dotnet build Tetris/Tests/Server/IntegrationTest

      - name: Run integration tests
        run: dotnet test Tetris/Tests/Server/IntegrationTest --logger "console;verbosity=detailed"

  deploy:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore server dependencies
        run: dotnet restore Tetris/TetrisServer/TetrisServer.csproj --runtime win-x86

      - name: Set up production environment
        shell: pwsh
        env:
          REDIS_HOST: ${{ secrets.REDISHOST }}
          REDIS_URL: ${{ secrets.REDISURL }}
        run: |
          $settingsPath = Join-Path $env:GITHUB_WORKSPACE 'Tetris/TetrisServer/appsettings.json'
          $settings = Get-Content -Raw -Path $settingsPath | ConvertFrom-Json
          $redisUri = [Uri]$env:REDIS_URL

          if (-not $redisUri.Host) {
              throw 'REDISURL does not contain a valid Redis hostname.'
          }

          $redisHost = if ($env:REDIS_HOST) { $env:REDIS_HOST } else { $redisUri.Host }
          $redisPort = if ($redisUri.Port -gt 0) { $redisUri.Port } else { 6379 }
          $redisSsl = $redisUri.Scheme -eq 'rediss'

          $user = ''
          $password = ''
          if ($redisUri.UserInfo) {
              $credentials = $redisUri.UserInfo -split ':', 2
              $user = [Uri]::UnescapeDataString($credentials[0])
              if ($credentials.Count -eq 2) {
                  $password = [Uri]::UnescapeDataString($credentials[1])
              }
          }

          $settings.Redis.User = $user
          $settings.Redis.Password = $password
          $settings.Redis.Ssl = $redisSsl
          $settings.Redis.Hosts[0].Host = $redisHost
          $settings.Redis.Hosts[0].Port = $redisPort
          $settings.ConnectionStrings.Redis = $env:REDIS_URL

          $settings | ConvertTo-Json -Depth 10 | Set-Content -Path $settingsPath -Encoding utf8

      - name: Publish server
        run: >-
          dotnet publish Tetris/TetrisServer/TetrisServer.csproj
          --configuration Release
          --output ./publish
          --runtime win-x86
          --no-restore

      - name: Deploy Server
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
