name: Test and deploy TetrisServer

on:
  push:
    branches:
      - main
    paths:
      - 'Tetris/TetrisServer/**'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet build Tetris/Tests/Server/UnitTest
        run: dotnet build Tetris/Tests/Server/IntegrationTest

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Run Server tests
        run: dotnet test Tetris/Tests/Server/UnitTest
        run: dotnet test Tetris/Tests/Server/IntegrationTest

      - name: Set up production environment
        uses: microsoft/variable-substitution@v1
        with:
          files: '${{env.DOTNET_ROOT}}/myapp/appsettings.json'
        env:
          REDIS_HOSTS_HOST: ${{ secrets.REDISHOST }}
          ConnectionStrings_Redis: ${{ secrets.REDISURL }}

      - name: Publish server
        run: >-
          dotnet publish Tetris/TetrisServer/TetrisServer.csproj
          --configuration Release
          --output ./publish
          --runtime win-x86
          --no-restore

      - name: Deploy Server
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
